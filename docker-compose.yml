version: "3.8"

# ================================================================
# TorrentBox — Blazing Fast VPS Torrent Stack
# Services: rtorrent-flood (all-in-one) · Filebrowser · Nginx
#
# Uses crazymax/rtorrent-flood which runs rTorrent + Flood
# in ONE container via supervisord — no socket sharing issues.
# ================================================================

services:

  # ── Torrent Engine + Web UI (all-in-one) ──────────────────────
  rtorrent-flood:
    image: crazymax/rtorrent-flood:latest
    container_name: rtorrent-flood
    restart: unless-stopped
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      TZ: "UTC"
      FLOOD_SECRET: "${FLOOD_SECRET}"
    volumes:
      - rtorrent-data:/data
      - downloads:/downloads
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - torrentbox
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── File Browser ──────────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - downloads:/srv
      - ./filebrowser/filebrowser.json:/.filebrowser.json:ro
      - filebrowser-db:/database
    networks:
      - torrentbox

  # ── Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      rtorrent-flood:
        condition: service_healthy
    networks:
      - torrentbox

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  rtorrent-data:
    driver: local
  downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOWNLOADS_PATH:-./data/downloads}
  filebrowser-db:
    driver: local

# ── Network ───────────────────────────────────────────────────────
networks:
  torrentbox:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
