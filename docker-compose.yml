version: "3.8"

# ================================================================
# TorrentBox — Blazing Fast VPS Torrent Stack
# Services: qBittorrent · Filebrowser · Nginx
#
# Uses lscr.io/linuxserver/qbittorrent — 500M+ Docker pulls,
# built-in web UI, PUID/PGID permission handling, zero socket issues.
# ================================================================

services:

  # ── Torrent Client ────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      TZ: "UTC"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - qbit-config:/config
      - downloads:/downloads
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
      - "8080:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - torrentbox
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── File Browser ──────────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - downloads:/srv
      - ./filebrowser/filebrowser.json:/.filebrowser.json:ro
      - filebrowser-db:/database
    networks:
      - torrentbox

  # ── Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      qbittorrent:
        condition: service_healthy
    networks:
      - torrentbox

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  qbit-config:
    driver: local
  downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOWNLOADS_PATH:-./data/downloads}
  filebrowser-db:
    driver: local

# ── Network ───────────────────────────────────────────────────────
networks:
  torrentbox:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
