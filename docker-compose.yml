version: "3.8"

# ================================================================
# TorrentBox — Blazing Fast VPS Torrent Stack
# Services: qBittorrent · Filebrowser · Nginx
# ================================================================

services:

  # ── Torrent Client ────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      TZ: "UTC"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - qbit-config:/config
      - ${DOWNLOADS_PATH:-./data/downloads}:/downloads
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
      - "8080:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - torrentbox
    # Use wget (always available in linuxserver Alpine images)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ── File Browser ──────────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    # Force root: the image bakes in a non-root USER; bind-mount dirs
    # are root-owned on the host so the non-root user gets EACCES.
    # filebrowser has its own login auth, running as root is safe here.
    user: "0:0"
    command:
      - "--database"
      - "/database/filebrowser.db"
      - "--root"
      - "/srv"
      - "--baseURL"          # note: --baseurl is deprecated
      - "/files"
      - "--log"
      - "stdout"
      - "--port"
      - "80"
    volumes:
      - ${DOWNLOADS_PATH:-./data/downloads}:/srv
      - ./data/filebrowser:/database
    networks:
      - torrentbox
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/files > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # service_started = don't block on healthcheck; nginx retries upstreams itself
    depends_on:
      qbittorrent:
        condition: service_started
      filebrowser:
        condition: service_started
    networks:
      - torrentbox

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  qbit-config:
    driver: local

# ── Network ───────────────────────────────────────────────────────
networks:
  torrentbox:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
