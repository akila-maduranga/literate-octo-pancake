worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections  65536;
    use                 epoll;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- Performance ---
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   120s;
    keepalive_requests  10000;

    # --- Buffers ---
    proxy_buffer_size       128k;
    proxy_buffers           8 256k;
    proxy_busy_buffers_size 256k;

    # --- Gzip ---
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstreams ────────────────────────────────────────────────
    upstream qbittorrent {
        server       qbittorrent:8080;
        keepalive    64;
    }

    upstream filebrowser {
        server       filebrowser:80;
        keepalive    16;
    }

    # ── Main Server ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Required by qBittorrent CSRF protection
        # The proxy must forward the correct Host header
        client_max_body_size 100M;

        # ── qBittorrent Web UI (/) ───────────────────────────────
        location / {
            proxy_pass         http://qbittorrent;
            proxy_http_version 1.1;

            # qBittorrent CSRF fix — must match WEBUI_PORT
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support (used by qBittorrent UI)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            proxy_connect_timeout 10s;
        }

        # ── Filebrowser (/files) ────────────────────────────────
        # ^~ gives priority; proxy_pass without a path suffix means
        # nginx forwards the full URI — filebrowser's baseURL=/files
        # handles the /files prefix on its own.
        location ^~ /files {
            proxy_pass         http://filebrowser;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
